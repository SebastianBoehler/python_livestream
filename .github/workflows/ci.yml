name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install stream system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Python dependencies
        run: python -m pip install -r requirements-stream.txt

      - name: Verify FFmpeg stream capabilities
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q anullsrc
          ffmpeg -hide_banner -protocols 2>/dev/null | grep -q '^  rtmps$'
          command -v Xvfb

      - name: Compile Python sources
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build default image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
